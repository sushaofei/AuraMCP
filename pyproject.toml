[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auramcp"
version = "0.1.0"
description = "AuraClaw extension service for extra Tools, Resources, and Prompts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "import-linter>=2.1,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
auramcp = "auramcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auramcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["auramcp"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "auramcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contracts are framework independent"
type = "forbidden"
source_modules = ["auramcp.contracts"]
forbidden_modules = [
  "auramcp.admin",
  "auramcp.catalog",
  "auramcp.composition",
  "auramcp.domain",
  "auramcp.extensions",
  "auramcp.identity",
  "auramcp.infrastructure",
  "auramcp.mcp",
  "auramcp.observability",
]

[[tool.importlinter.contracts]]
name = "Domain only depends on contracts"
type = "forbidden"
source_modules = ["auramcp.domain"]
forbidden_modules = [
  "auramcp.admin",
  "auramcp.catalog",
  "auramcp.composition",
  "auramcp.extensions",
  "auramcp.identity",
  "auramcp.infrastructure",
  "auramcp.mcp",
  "auramcp.observability",
]

[[tool.importlinter.contracts]]
name = "MCP and Admin are transport only"
type = "forbidden"
source_modules = ["auramcp.mcp", "auramcp.admin"]
forbidden_modules = ["auramcp.composition", "auramcp.infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure ignores delivery surfaces and composition"
type = "forbidden"
source_modules = ["auramcp.infrastructure"]
forbidden_modules = ["auramcp.admin", "auramcp.composition", "auramcp.mcp"]

[[tool.importlinter.contracts]]
name = "Business packages do not import composition"
type = "forbidden"
source_modules = [
  "auramcp.catalog",
  "auramcp.extensions",
  "auramcp.identity",
  "auramcp.observability",
]
forbidden_modules = ["auramcp.composition"]

[[tool.importlinter.contracts]]
name = "No AuraClaw or chaintower coupling"
type = "forbidden"
source_modules = ["auramcp"]
forbidden_modules = ["auraclaw", "chaintower"]
